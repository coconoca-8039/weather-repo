name: Weather Test

on:
  workflow_dispatch:
  schedule:
    - cron: "0 21 * * *"

jobs:
  weather:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Test Python environment
        run: |
          python --version
          python -c "import xarray, matplotlib, cartopy, numpy, scipy, requests, metpy, pandas; import herbie; print('All imports OK')"

      - name: Run weather charts
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          mkdir -p images
          bash run_all_parallel.sh